<!DOCTYPE html>
<html>
    <head>
        <title>Cafe - Cart</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="container">
            <header>
                <div class="logo">
                    <img src="images/logo.png" alt="Cafe Logo" width="100px">
                </div>
                <div class="menu_list">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="about.html">About</a></li>
                        <li><a href="menu.html">Menu</a></li>
                        <li><a href="orderonline.html">Order online</a></li>
                        <li><a href="contact.html">Contact Us</a></li>
                    </ul>
                </div>
            </header>
            <article>
                <div class="cart_section">
                    <h1>Your Shopping Cart</h1>
                    <div class="cart_table_container">
                        <table class="cart_table">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Price</th>
                                    <th>Quantity</th>
                                    <th>Total</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>
                                        <div class="cart_item_info">
                                            <img src="images/espresso.jpg" alt="Espresso" class="cart_item_img">
                                            <span>Espresso</span>
                                        </div>
                                    </td>
                                    <td>$3.00</td>
                                    <td>
                                        <input type="number" value="2" min="1" class="qty_input">
                                    </td>
                                    <td>$6.00</td>
                                    <td><button class="remove_btn">Remove</button></td>
                                </tr>
                                <tr>
                                    <td>
                                        <div class="cart_item_info">
                                            <img src="images/Latte.jpg" alt="Latte" class="cart_item_img">
                                            <span>Latte</span>
                                        </div>
                                    </td>
                                    <td>$4.50</td>
                                    <td>
                                        <input type="number" value="1" min="1" class="qty_input">
                                    </td>
                                    <td>$4.50</td>
                                    <td><button class="remove_btn">Remove</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="cart_summary">
                        <div class="cart_total">
                            <h3>Total: <span>$10.50</span></h3>
                        </div>
                        <button class="checkout_btn">Proceed to Checkout</button>
                    </div>
                </div>
            </article>
            <footer>
                <div class="footer_content">
                    <p>&copy; 2026 Cafe. All rights reserved.</p>
                </div>
            </footer>
        </div>
    </body>
</html>
